<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('/static/bg.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            margin: 0;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            width: 400px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 20px;
        }
        .search-box input {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 20px;
            outline: none;
        }
        .search-box button {
            background: red;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        .search-box button:hover {
            background: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CINESCOPE</h1>
        <form class="search-box" action="{{ url_for('search_movie') }}" method="GET">
            <input type="text" name="query" placeholder="Search movies..." required>
            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
